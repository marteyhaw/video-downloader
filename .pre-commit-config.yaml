repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Run oxlint/oxfmt from frontend/node_modules so they match package.json
  # (and skip pre-commit's nodeenv). Requires `pnpm install` in frontend/.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (frontend lint)
        entry: pnpm --dir frontend exec oxlint src/
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: oxfmt
        name: oxfmt (frontend format)
        entry: pnpm --dir frontend exec oxfmt src/
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
