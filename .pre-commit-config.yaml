repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.66.0
    hooks:
      - id: oxlint
        files: ^frontend/src/
        types_or: [ts, tsx]

  # oxfmt has no pre-commit mirror; run the locally-installed binary via pnpm.
  # Requires `pnpm install` to have run in frontend/.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (frontend format)
        entry: pnpm --dir frontend exec oxfmt src/
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
