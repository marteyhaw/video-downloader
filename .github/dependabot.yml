version: 2
updates:
  # Keep pinned GitHub Actions SHAs current. Action bumps are low-risk SHA swaps,
  # so group them all into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Python deps (pyproject.toml + uv.lock). Group minor/patch into one PR;
  # majors get their own PR so breaking changes are reviewed in isolation.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend deps (pnpm-lock.yaml). Same policy: bundle minor/patch, isolate majors.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
