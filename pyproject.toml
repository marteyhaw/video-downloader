[project]
name = "video-downloader"
version = "0.1.0"
description = "Local-first video downloader with Playwright and yt-dlp"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "playwright==1.62.0",
    "yt-dlp[curl-cffi]==2026.8.19",
    "m3u8==6.0.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.52",
    "aiosqlite==0.22.1",
    "filetype==1.2.0",
    "pydantic-settings==2.15.0",
]

[project.scripts]
video-downloader-api = "backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "pre-commit==4.6.2",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
src = ["backend", "tests"]
exclude = [
    "migrations",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "SIM105",  # contextlib.suppress vs try/except/pass (Playwright best-effort clicks)
    "SIM102",  # collapsible-if (readability preference)
    "SIM117",  # combine with statements (async with chaining can be less readable)
    "RUF001",  # ambiguous unicode in strings (en-dashes are intentional)
    "RUF003",  # ambiguous unicode in comments
    "RUF006",  # dangling asyncio.create_task (fire-and-forget by design)
    "SIM103",  # return-bool-condition (explicit if/return is often clearer)
    "SIM110",  # use-any (explicit loop is often clearer)
    "B011",    # assert-false in tests
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["backend"]
case-sensitive = true
combine-as-imports = true
